# ==============================================================================
# Akij Group - Central IT Asset Governance & Multi-Location Audit Portal
# Production Docker Compose for Remote Server Deployment
# ==============================================================================
# Image Sources:
#   Web: boniyeamin/ag-audit:production (Docker Hub)
#   DB:  postgres:16-alpine (Docker Hub)
#   Proxy (optional): nginx:alpine (Docker Hub)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ag_audit_db
    restart: always
    environment:
      POSTGRES_DB: ${AUDIT_DB_NAME:-ag_audit}
      POSTGRES_USER: ${AUDIT_DB_USER:-ag_audit}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:?Set AUDIT_DB_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    networks:
      - audit_internal

  # ----------------------------------------------------------------------------
  # Django Core Application (Gunicorn + Whitenoise)
  # ----------------------------------------------------------------------------
  web:
    image: boniyeamin/ag-audit:production
    container_name: ag_audit_web
    restart: always
    pull_policy: always
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS in .env}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-0}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
      DJANGO_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_HSTS_INCLUDE_SUBDOMAINS:-1}
      DJANGO_HSTS_PRELOAD: ${DJANGO_HSTS_PRELOAD:-0}
      AUDIT_DB_ENGINE: postgresql
      AUDIT_DB_HOST: db
      AUDIT_DB_PORT: "5432"
      AUDIT_DB_NAME: ${AUDIT_DB_NAME:-ag_audit}
      AUDIT_DB_USER: ${AUDIT_DB_USER:-ag_audit}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?Set AUDIT_DB_PASSWORD in .env}
      AUDIT_DB_CONN_MAX_AGE: ${AUDIT_DB_CONN_MAX_AGE:-60}
      AUDIT_EMAIL_HOST: ${AUDIT_EMAIL_HOST:-localhost}
      AUDIT_EMAIL_PORT: ${AUDIT_EMAIL_PORT:-25}
      AUDIT_EMAIL_HOST_USER: ${AUDIT_EMAIL_HOST_USER:-}
      AUDIT_EMAIL_HOST_PASSWORD: ${AUDIT_EMAIL_HOST_PASSWORD:-}
      AUDIT_EMAIL_USE_TLS: ${AUDIT_EMAIL_USE_TLS:-0}
      AUDIT_FROM_EMAIL: ${AUDIT_FROM_EMAIL:-audit@localhost}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    ports:
      # Exposes Gunicorn directly or to an external host reverse proxy
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - audit_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/login/'), timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    networks:
      - audit_internal

  # ----------------------------------------------------------------------------
  # Optional Integrated Nginx Reverse Proxy (Enable via profiles if needed)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ag_audit_nginx
    restart: always
    profiles:
      - with-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - audit_media:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - audit_internal

volumes:
  postgres_data:
    name: ag_audit_postgres_data
  audit_media:
    name: ag_audit_media

networks:
  audit_internal:
    name: ag_audit_network
    driver: bridge
