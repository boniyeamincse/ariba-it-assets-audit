# ==============================================================================
# Akij Group - Central IT Asset Governance & Audit Portal
# Nginx Reverse Proxy Configuration
# ==============================================================================

upstream audit_backend {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow ACME challenge for Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy to Django Gunicorn application
    location / {
        proxy_pass http://audit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 30s;
        client_max_body_size 30M;
    }

    # Media uploads direct delivery
    location /media/ {
        alias /app/media/;
        expires 30d;
        access_log off;
    }
}
